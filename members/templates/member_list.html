<!DOCTYPE html>
<html>
<head>

    <title>Members</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Member List</h2>

    <table class="table table-bordered">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Photo</th>
            <th>Print</th>
        </tr>

        {% for member in members %}

        <tr>
            <td>{{ member.id }}</td>
            <td>{{ member.full_name }}</td>
            <td>{{ member.mobile }}</td>

            <td>
                <img src="{{ member.photo.url }}" width="80">
            </td>

            <td>
                <a href="/print/{{ member.id }}/" class="btn btn-success">
                    Print
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

</div>
</body>
</html>
